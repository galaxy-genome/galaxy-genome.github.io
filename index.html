    <!-- First paint, before the CSS and the bundle arrive: the shell's frame with list rows (the map's starfield on /map).

    <script>document.documentElement.dataset.boot = location.pathname.split('/')[1] || 'map'</script>
    <!-- On /map the galaxy map's first files load beside the bundle; the map page reads them from window.__ggMapPre
         (path -> promise of the text, or null). scripts/sync-map.sh writes the map's build stamp into mapV. -->
    <script>
      if (document.documentElement.dataset.boot === 'map') {
        const mapV = 'ccd7fd6f25'
        let lang = 'en'
        try { lang = localStorage.getItem('gg.lang') || 'en' } catch {}
        window.__ggMapPre = {}
        for (const f of new Set(['data/galaxy.json', 'app.js', 'data/lang/en.json', `data/lang/${lang}.json`])) {
          const path = `${f}?v=${mapV}`
          window.__ggMapPre[path] = fetch(`/galaxy-map/${path}`).then((r) => (r.ok ? r.text() : null), () => null)
        }
      }
    </script>
